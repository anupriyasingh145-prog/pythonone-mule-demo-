name: CI/CD Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ghcr.io/anupriyasingh145-prog/pythonone-mule-demo

jobs:
  # Job 1: Build the Mule app and handle tests
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 11
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '11'
          cache: 'maven'

      - name: Build application JAR
        run: mvn -B clean package -DskipMunitTests=true

      - name: Upload built artifact
        uses: actions/upload-artifact@v4
        with:
          name: mule-app-jar
          path: target/*.jar

  # Job 2: Build Docker image and push to GitHub Container Registry
  docker-build-push:
    needs: build-and-test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push self-contained image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile.selfcontained
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest

  # Job 3: Deploy to Kubernetes Cluster
